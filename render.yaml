services:
  - type: web
    name: final-report-app
    env: python
    region: oregon
    plan: free
    pythonVersion: 3.11
    buildCommand: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt
    startCommand: cd backend && python3 -m gunicorn -w 4 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /
